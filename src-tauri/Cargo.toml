[package]
name = "codakiller"
version = "9.1.3"
description = "Voice-first practice and rep tracker for pianists"
authors = ["CodaKiller contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codakiller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
cpal = "0.18.2"
hound = "3.5.1"
crossbeam-queue = "0.3.13"
# `libc` is required for STT child-process control that `std::process` cannot do:
# placing the child in its own process group (`setpgid` via `pre_exec`) and
# sending SIGTERM to that group (`killpg`). std's `Child::kill` only sends SIGKILL
# to the single child; the Task 9 spike proved `hear` needs a clean SIGTERM and
# that group-signaling is needed to avoid orphaned grandchildren. Already present
# transitively (cpal/rusqlite), so this adds no new compilation.
libc = "0.2"
# TTS (Task 11). Both crates are ALREADY in Cargo.lock transitively via tauri, so
# declaring them direct adds zero new compilation. `reqwest` was pulled with
# default-features=false (no TLS backend); we opt into `native-tls` which on macOS is
# Security.framework (already linked) — no openssl, no ring — the lean choice on 8GB.
# `blocking` lets the Gemini client run a synchronous request on the Speaker worker
# thread (no async runtime bleed into the audio/command paths). Pinned to 0.13 to reuse
# the exact locked 0.13.4 (avoids a second reqwest copy).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
# Decodes the Gemini `steps[].content[].data` base64 (24 kHz s16le PCM). Already at
# 0.22.1 in the lock via reqwest.
base64 = "0.22"
# Content-addresses day photos (Plan A, task A3). Already at 0.10.9 in the lock
# transitively (via reqwest's TLS stack), so this adds zero new compilation.
sha2 = "0.10"
# Reads MusicXML as a bounded event stream. `quick-xml` never resolves the
# external DTD declarations present in the real KernScores files, so score
# context cannot cause a network fetch or entity expansion.
quick-xml = "0.41"

# ── Screen-resolution page images (score::page_image) ──────────────────────────
# Nine of Christian's eleven editions are scans whose page is ONE giant image:
# the Henle Op.90 is 5223x7291 = 38.1 MP inside a 1.0 MB file. Rasterizing that
# page through PDF.js decodes every one of those pixels; extracting the embedded
# image and decoding it straight to screen resolution does not. These five crates
# are the minimum needed to do that without a C dependency — CodaKiller must not
# grow a runtime requirement on poppler/qpdf/ghostscript, none of which exist on
# the target machine. All are pure Rust and MIT/Apache-2.0.
#
#   lopdf         reads the page's content stream + image XObject dictionary.
#                 Default features pull chrono/jiff/rayon/time for authoring
#                 metadata we never write, so they are off.
#   jpeg-decoder  DCT *scaled* decoding (1/2, 1/4, 1/8 straight out of the
#                 coefficients). `rayon` is off: this already runs on a blocking
#                 pool thread, and an 8 GB M2 Air does not want a second pool.
#   hayro-jbig2   the format the two worst files use. `simd` is deliberately OFF:
#                 measured on the real Henle page, std-only decodes in ~210 ms and
#                 the fearless_simd path in ~350 ms.
#   hayro-ccitt   Group 3/4 fax, the other bilevel scan format in the vault.
#   jpeg-encoder  writes the cached screen-resolution page back out.
lopdf = { version = "0.44", default-features = false }
jpeg-decoder = { version = "0.3", default-features = false }
hayro-jbig2 = { version = "0.3", default-features = false, features = ["std"] }
hayro-ccitt = "0.3"
jpeg-encoder = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Tempdir fixtures for the vault scan tests (real vault is never touched by tests).
# Already present in Cargo.lock (transitive), so this pins the same 3.x build.
tempfile = "3"
