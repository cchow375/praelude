[package]
name = "codakiller"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codakiller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
cpal = "0.18.1"
hound = "3.5.1"
crossbeam-queue = "0.3.13"
# `libc` is required for STT child-process control that `std::process` cannot do:
# placing the child in its own process group (`setpgid` via `pre_exec`) and
# sending SIGTERM to that group (`killpg`). std's `Child::kill` only sends SIGKILL
# to the single child; the Task 9 spike proved `hear` needs a clean SIGTERM and
# that group-signaling is needed to avoid orphaned grandchildren. Already present
# transitively (cpal/rusqlite), so this adds no new compilation.
libc = "0.2"

